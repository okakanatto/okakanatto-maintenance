# このリポジトリ自身のテスト（push・PR のたび）
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 設定ファイルの検証
        run: python3 -m maint validate
      - name: テスト
        run: python3 -m unittest discover -s tests -t . -v
